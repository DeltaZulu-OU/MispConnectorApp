name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Read release metadata from project file
        id: metadata
        shell: pwsh
        run: |
          $projectPath = 'src/MispConnectorApp.csproj'

          if (-not (Test-Path $projectPath)) {
            throw "Project file not found at '$projectPath'."
          }

          [xml]$project = Get-Content $projectPath
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read <Version> from '$projectPath'."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not a 3-part version. Expected format: major.minor.patch."
          }

          $appName = 'MispConnectorApp'
          $tag = "v$version"

          "app_name=$appName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "App name: $appName"
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Validate release tag is new
        shell: pwsh
        run: |
          $tag = '${{ steps.metadata.outputs.tag }}'
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"

          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Tag '$tag' already exists. Bump <Version> in src/MispConnectorApp.csproj before releasing."
          }

      - name: Restore and build solution
        run: msbuild src/MispConnectorApp.slnx /restore /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackagesConfig=true /m

      - name: Create and push git tag
        shell: pwsh
        run: |
          $tag = '${{ steps.metadata.outputs.tag }}'
          git tag $tag
          git push origin "refs/tags/$tag"

      - name: Prepare release package
        id: artifacts
        shell: pwsh
        run: |
          $appName = '${{ steps.metadata.outputs.app_name }}'
          $version = '${{ steps.metadata.outputs.version }}'

          $dllPath = 'src/bin/Release/MispConnectorApp.dll'
          $configPath = 'dnsApp.config'
          $readmePath = 'README.md'

          if (-not (Test-Path $dllPath)) {
            throw "Built DLL not found at '$dllPath'."
          }

          if (-not (Test-Path $configPath)) {
            throw "DNS app config file not found at '$configPath'."
          }

          if (-not (Test-Path $readmePath)) {
            throw "README file not found at '$readmePath'."
          }

          $stagingPath = "release/$appName"
          $zipPath = "release/$appName-$version.zip"

          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          Copy-Item $dllPath "$stagingPath/MispConnectorApp.dll"
          Copy-Item $configPath "$stagingPath/dnsApp.config"
          Copy-Item $readmePath "$stagingPath/README.md"

          Compress-Archive -Path "$stagingPath/*" -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.app_name }} v${{ steps.metadata.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.artifacts.outputs.zip_path }}